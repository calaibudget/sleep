<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep</title>
<meta name="theme-color" content="#f6f2ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sleep">
<meta name="description" content="Personal sleep tracker for Fitbit Air. Your data goes from Google straight to this phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --paper:#f6f2ec; --card:#fff; --chip:#f3ece4; --line:#ece4da;
  --ink:#1f1b17; --ink-2:#5b5249; --ink-3:#8a8177;
  --coral:#e2603f; --coral-soft:#fbe3d9;
  /* stages: one ordinal blue ramp (deep -> REM) + coral awake, validated on white */
  --deep:#283a7a; --light:#5b6fd6; --rem:#a9a3ee; --awake:#e2603f;
  --shadow:0 14px 32px -22px rgba(80,55,30,.45);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --font:-apple-system,"SF Pro Text",BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,"SF Pro Display",BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--deep)}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(var(--sat) + 4px) 18px calc(var(--sab) + 96px)}

/* top bar */
.top{position:sticky;top:0;z-index:20;margin:0 -18px;padding:calc(var(--sat) + 8px) 18px 8px;background:linear-gradient(var(--paper) 78%,rgba(246,242,236,0))}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.datenav{display:flex;align-items:center;gap:2px;margin-left:-8px}
.datenav button{appearance:none;border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.datenav button:active{background:var(--chip)}
.datenav button:disabled{opacity:.25}
.datenav span{font-weight:600;color:var(--ink-2);font-size:15.5px;min-width:96px;text-align:center}
.chip-sample{font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:#ffe3c7;color:#a3471f;border:0}
.chip-sync{font-size:12.5px;font-weight:600;color:var(--ink-3);display:inline-flex;gap:6px;align-items:center;background:none;border:0;padding:6px 0}
.chip-sync i{width:7px;height:7px;border-radius:50%;background:#2fa84f}
.title{font:700 30px/1.13 var(--display);letter-spacing:-.6px;margin:4px 0 6px}
.title em{font-style:normal;color:var(--coral)}
.lede{color:var(--ink-2);font-size:16px;margin:0 0 18px}

/* cards */
.card{background:var(--card);border-radius:26px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font:700 17px/1.25 var(--display);margin:0}
.card .sub{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.k{font-size:13.5px;font-weight:600;color:var(--ink-3)}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end}
.hero .big{font:800 88px/0.88 var(--display);letter-spacing:-3.5px;color:var(--coral);margin-top:6px}
.hero .usual{text-align:right}
.hero .usual b{display:block;font:700 23px/1.2 var(--display)}
.hero .usual span{font-size:13px;color:var(--ink-3)}
.rangebar{position:relative;height:22px;margin:16px 0 4px}
.rangebar .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:var(--chip)}
.rangebar .band{position:absolute;top:5px;height:12px;border-radius:6px;background:#e9e1f7}
.rangebar .med{position:absolute;top:3px;width:2px;height:16px;margin-left:-1px;background:var(--light);border-radius:2px}
.rangebar .me{position:absolute;top:2px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px #fff}
.rangecap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chips span{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--chip);color:var(--ink-2)}
.chips span b{color:var(--ink)}
.how{margin-top:12px;font-size:14px;color:var(--ink-2)}
.how summary{color:var(--deep);font-weight:600;cursor:pointer;list-style:none}
.how summary::-webkit-details-marker{display:none}
.how p{margin:8px 0 0}
.mini{margin-top:16px}
.mini .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:6px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border-radius:22px;padding:14px 15px 13px;box-shadow:var(--shadow);min-height:96px}
.tile .k{display:flex;align-items:center;gap:6px;font-size:13px}
.tile .k i{width:9px;height:9px;border-radius:3px;display:inline-block}
.tile .v{font:700 26px/1.2 var(--display);margin-top:4px;letter-spacing:-.3px}
.tile .v small{font:600 14px var(--font);color:var(--ink-3);margin-left:3px;letter-spacing:0}
.tile .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.pin{border-radius:50%;border:2px solid var(--coral);background:#fff}
.legend i.up{background:repeating-linear-gradient(45deg,rgba(226,96,63,.6) 0 2px,transparent 2px 4px)}
.toggle{appearance:none;border:0;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.toggle[aria-pressed=true]{background:var(--ink);color:#fff}
.tl{touch-action:pan-y;position:relative}
svg text{font-family:var(--font)}

.wake{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.wake:first-child{border-top:0}
.wake .dot{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--coral);flex:none}
.wake .dot.full{background:var(--coral)}
.wake .t{font-weight:700;width:52px}
.wake .w{flex:1;color:var(--ink-2);font-size:14.5px}
.wake .l{font-weight:600;font-size:14.5px}
.badge{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--coral-soft);color:#a3471f;margin-left:6px}
.more{appearance:none;border:0;background:none;color:var(--deep);font-weight:600;padding:10px 0 0;cursor:pointer}

.addrow{display:flex;gap:8px;margin-top:12px}
.input{flex:1;min-width:0;background:var(--chip);border:1.5px solid transparent;border-radius:14px;padding:11px 13px;outline:none;font-size:16px}
.input:focus{border-color:var(--light);background:#fff}

.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font-weight:700;font-size:16px;background:var(--chip);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn.small{padding:9px 14px;font-size:14px;border-radius:12px}

/* trends */
.seg{display:flex;background:#ebe4da;border-radius:14px;padding:3px;margin:0 0 14px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:11px;padding:8px 0;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(80,55,30,.15)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}


/* you */
.metric .lab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.metric .lab b{color:var(--ink)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 40px;font-size:15px;color:var(--ink-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;background:var(--chip);color:var(--ink);font-weight:700;font-size:13.5px;display:grid;place-items:center}
.steps li b{display:block;color:var(--ink)}
.code{font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;background:var(--chip);border-radius:8px;padding:2px 6px;word-break:break-all}
.copy{appearance:none;border:0;background:none;color:var(--deep);font-weight:700;font-size:13.5px;padding:2px 4px;cursor:pointer}
.form{display:grid;gap:10px;margin-top:8px}
.state{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.st{background:var(--chip);border-radius:16px;padding:11px 12px}
.st small{display:block;font-size:12.5px;color:var(--ink-3)}
.st b{font-size:15.5px}
.ok{color:#2a8a45}.no{color:#b5462a}
.note{font-size:13.5px;color:var(--ink-3);margin-top:10px}
.log{font-size:13px;color:var(--ink-2);margin-top:8px}
.log div{padding:4px 0;border-top:1px solid var(--line)}
.banner{display:flex;gap:10px;align-items:flex-start;background:#fff1df;border-radius:18px;padding:12px 14px;margin:0 0 14px;font-size:14px;color:#6b4a1f}
.banner b{color:#3d2a10}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 0 calc(var(--sab) + 8px);background:rgba(246,242,236,.86);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border-top:1px solid rgba(0,0,0,.05)}
.tabbar .in{display:flex;justify-content:space-around;width:100%;max-width:520px}
.tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#a39b91;min-width:64px;cursor:pointer;padding:2px 0}
.tabbar button[aria-selected=true]{color:var(--ink)}
.tabbar svg{width:25px;height:25px}

/* tooltip bubble */
.bubble{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:#fff;border-radius:12px;padding:8px 11px;font-size:13px;line-height:1.35;opacity:0;transition:opacity .12s;max-width:240px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.bubble b{font-weight:700}
section[hidden]{display:none}
.empty{color:var(--ink-3);text-align:center;padding:24px 8px}
.handoff{text-align:center;padding-top:40px}
.handoff .title{margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="row">
    <div class="datenav" id="datenav"><button id="prev" aria-label="Previous night"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3 5 9l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span id="dateLbl">–</span><button id="next" aria-label="Next night"><svg width="18" height="18" viewBox="0 0 18 18"><path d="m7 3 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div id="topRight"></div>
  </div></header>

  <section id="s-night"></section>
  <section id="s-trends" hidden></section>
  <section id="s-you" hidden></section>
</div>
<nav class="tabbar" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="night" aria-selected="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 21a9 9 0 0 1-6.7-15.1 8 8 0 1 0 10.2 10.9A9 9 0 0 1 15.5 21z"/></svg>Night</button>
  <button role="tab" data-tab="trends" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V4"/></svg>Trends</button>
  <button role="tab" data-tab="you" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0" stroke-linecap="round"/></svg>You</button>
</div></nav>
<div class="bubble" id="bubble"></div>

<script>
"use strict";
/* =====================================================================
   Sleep (iPhone web app). Runs entirely on this device:
   - signs in to Google (you type your password on Google's own page)
   - reads your sleep from the Google Health API, read-only
   - stores it in this browser's own storage. No other server.
   ===================================================================== */
const STAGE = {
  D:{name:"Deep",   color:"var(--deep)",  hex:"#1c5cab", lane:3},
  L:{name:"Light",  color:"var(--light)", hex:"#3987e5", lane:2},
  R:{name:"REM",    color:"var(--rem)",   hex:"#86b6ef", lane:1},
  W:{name:"Awake",  color:"var(--awake)", hex:"#d95926", lane:0},
  A:{name:"Asleep", color:"var(--light)", hex:"#3987e5", lane:2},
  X:{name:"Restless",color:"var(--awake)",hex:"#d95926", lane:0},
};
const SLEEP_CODES = new Set(["D","L","R","A"]);

const pad = (n) => String(n).padStart(2,"0");
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const loc = (ms, off) => new Date(ms + (off||0)*60000);
const clock = (ms, off) => { const d = loc(ms, off); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const minOfDay = (ms, off) => { const d = loc(ms, off); return d.getUTCHours()*60 + d.getUTCMinutes(); };
const dur = (m) => { if (m == null || !isFinite(m)) return "–"; m = Math.round(m); const h = Math.floor(m/60), r = m%60; return h ? `${h}h ${pad(r)}m` : `${r}m`; };
const durShort = (min) => min < 1 ? `${Math.round(min*60)}s` : min < 10 ? `${(Math.round(min*10)/10).toString().replace(/\.0$/,"")} min` : `${Math.round(min)} min`;
const parseYmd = (s) => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
const ymd = (d) => `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const addDays = (s, n) => { const d = parseYmd(s); d.setUTCDate(d.getUTCDate()+n); return ymd(d); };
const dayLabel = (s) => { const d = parseYmd(s); return `${DOW[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const shortLabel = (s) => { const d = parseYmd(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const median = (a) => { const v = a.filter(x => x != null && isFinite(x)).sort((x,y)=>x-y); if (!v.length) return null; const m = Math.floor(v.length/2); return v.length%2 ? v[m] : (v[m-1]+v[m])/2; };
const quant = (a, q) => { const v = a.filter(x => x != null && isFinite(x)).sort((x,y)=>x-y); if (!v.length) return null; const i = (v.length-1)*q, lo = Math.floor(i), hi = Math.ceil(i); return v[lo] + (v[hi]-v[lo])*(i-lo); };
const mean = (a) => { const v = a.filter(x => x != null && isFinite(x)); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
const sd = (a) => { const m = mean(a); const v = a.filter(x => x != null && isFinite(x)); return v.length > 1 ? Math.sqrt(v.reduce((s,x)=>s+(x-m)**2,0)/(v.length-1)) : null; };
const round1 = (x) => x == null ? null : Math.round(x*10)/10;
const signed = (x, digits=0, unit="") => x == null ? "" : `${x > 0 ? "+" : x < 0 ? "−" : "±"}${Math.abs(x).toFixed(digits)}${unit}`;

function computeMetrics(n) {
  const st = n.stages || [];
  const sleepSt = st.filter(s => SLEEP_CODES.has(s[0]));
  const onset = sleepSt.length ? sleepSt[0][1] : n.start;
  const finalWake = sleepSt.length ? sleepSt[sleepSt.length-1][2] : n.end;
  const raw = [];
  for (const s of st) if ((s[0] === "W" || s[0] === "X") && s[1] >= onset && s[2] <= finalWake) raw.push([s[1], s[2], "stage"]);
  for (const s of (n.short || [])) if (s[0] >= onset && s[1] <= finalWake) raw.push([s[0], s[1], "short"]);
  raw.sort((a,b) => a[0]-b[0]);
  const merged = [];
  for (const r of raw) { const last = merged[merged.length-1]; if (last && r[0] <= last[1] + 60000) last[1] = Math.max(last[1], r[1]); else merged.push([r[0], r[1]]); }
  const stageAt = (t) => { for (const s of st) if (t >= s[1] && t < s[2]) return s[0]; return null; };
  const events = merged.map(([s,e], i) => {
    const m = (e - s)/60000;
    const up = (n.oob || []).some(o => o[0] < e && o[1] > s);
    let before = null; for (const x of st) { if (x[2] <= s + 1000 && SLEEP_CODES.has(x[0])) before = x[0]; if (x[1] > s) break; }
    if (!before) before = stageAt(s - 1000);
    return {i:i+1, s, e, min:m, kind: m < 3 ? "brief" : m <= 5 ? "short" : "full", up, before};
  });
  const minsBy = {D:0,L:0,R:0,W:0,A:0,X:0};
  for (const s of st) minsBy[s[0]] = (minsBy[s[0]]||0) + (s[2]-s[1])/60000;
  const asleep = n.sum?.asleep ?? (minsBy.D + minsBy.L + minsBy.R + minsBy.A);
  const inBed = (n.end - n.start)/60000;
  let wakeIn = 0; for (const s of st) if ((s[0]==="W"||s[0]==="X") && s[1] >= onset && s[2] <= finalWake) wakeIn += (s[2]-s[1])/60000;
  const latency = n.sum?.toFall > 0 ? n.sum.toFall : Math.max(0, (onset - n.start)/60000);
  return {
    onset, finalWake, events, count: events.length,
    perHour: asleep > 0 ? events.length/(asleep/60) : null,
    brief: events.filter(e=>e.kind==="brief").length, shortN: events.filter(e=>e.kind==="short").length,
    full: events.filter(e=>e.kind==="full").length, up: (n.oob||[]).length,
    deep: minsBy.D, light: minsBy.L + minsBy.A, rem: minsBy.R, awakeIn: wakeIn,
    asleep, inBed, eff: inBed > 0 ? asleep/inBed : null, latency, classic: n.type === "CLASSIC",
  };
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeSample() {
  const rnd = mulberry32(20261116), R = (a,b) => a + (b-a)*rnd(), gauss = () => { let u=0; for (let i=0;i<6;i++) u+=rnd(); return u-3; };
  const OFF = 180; // sample nights use Riyadh time (UTC+3)
  const nights = [], daily = {}, tags = {byDate:{}, custom:[]}, hr = new Map();
  const todayLocal = new Date(Date.now() + OFF*60000); const today = ymd(new Date(Date.UTC(todayLocal.getUTCFullYear(), todayLocal.getUTCMonth(), todayLocal.getUTCDate())));
  for (let k = 119; k >= 0; k--) {
    const date = addDays(today, -k), bedDay = addDays(date, -1), dow = parseYmd(bedDay).getUTCDay();
    if (k === 41 || k === 77) continue; // two nights with no record, as happens when the band is off
    const weekend = dow === 4 || dow === 5;
    const t = {
      "Alcohol": rnd() < (weekend ? .32 : .07), "Late meal": rnd() < .2, "Caffeine after 2pm": rnd() < .24, "Late workout": rnd() < .14,
      "Late screens": rnd() < .3, "Stress": rnd() < .17, "Travel": rnd() < .03, "Unwell": rnd() < .025 };
    const on = Object.keys(t).filter(x => t[x]);
    if (on.length) tags.byDate[date] = {tags:on, note:""};
    const bedMin = 23*60 + 5 + gauss()*24 + (weekend ? 50 : 0) + (t.Travel ? 70 : 0);
    const startUtc = parseYmd(bedDay).getTime() + bedMin*60000 - OFF*60000;
    let cur = startUtc; const stages = [], short = [], oob = [];
    const push = (c, m) => { const e = cur + Math.round(m*60)*1000; stages.push([c, cur, e]); cur = e; };
    push("W", R(5,15) + (t["Caffeine after 2pm"] ? 9 : 0) + (t.Stress ? 6 : 0));
    const budget = (7.1 + gauss()*0.35 + (weekend ? .45 : 0) - (t.Alcohol ? .25 : 0) + (t.Unwell ? .5 : 0)) * 60;
    let slept = 0, cyc = 0;

  svg.querySelectorAll("path[data-i]").forEach(p => { const e = S.extra[nights[+p.dataset.i].date]; if (!e?.hasHr || !e.surges || !e.lone) return; const bb = p.getBBox(), hh = bb.height * (e.lone / e.surges); const r = document.createElementNS("http://www.w3.org/2000/svg", "rect"); r.setAttribute("x", bb.x); r.setAttribute("y", bb.y + bb.height - hh); r.setAttribute("width", bb.width); r.setAttribute("height", Math.max(0, hh)); r.setAttribute("rx", Math.min(2, bb.width / 2)); r.setAttribute("fill", "#8f3b2f"); r.setAttribute("pointer-events", "none"); svg.appendChild(r); });
}
/* ---------------- YOU (connect + settings) ---------------- */
let flash = null;
function renderYou() {
  const el = $("#s-you"), c = client(), t = tokens(), sy = S.sync, last = LS.get("lastSyncAt");
  const copyBtn = (v) => `<button class="copy" data-copy="${esc(v)}">Copy</button>`;
  el.innerHTML = `<div class="title">You</div><div class="note" style="margin:-2px 0 12px">Version ${APP_VERSION} · ${standalone() ? "Home Screen app" : "Safari: open Sleep from your Home Screen instead"}</div>
    ${flash ? `<div class="banner" style="${flash.ok ? "background:#e4f4e6;color:#1d5b2c" : ""}"><span>${flash.ok ? "✓" : "⚠"}</span><span>${esc(flash.text)}</span></div>` : ""}
    <div class="card"><div class="card-head"><div><h2>Google Health</h2><div class="sub">Your Fitbit Air data, read-only, straight to this phone</div></div></div>
      <div class="state"><div class="st"><small>Signed in</small><b class="${t?.refreshToken ? "ok" : "no"}">${t?.refreshToken ? "Yes" : "Not yet"}</b></div><div class="st"><small>Last sync</small><b>${sy.running ? "Syncing…" : last ? new Date(last).toLocaleString("en-GB", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "Never"}</b></div><div class="st"><small>Nights on this phone</small><b class="num">${S.mode === "live" ? S.nights.length : 0}</b></div><div class="st"><small>Data shown</small><b>${S.mode === "live" ? "Yours" : "Sample"}</b></div></div>
      ${sy.running ? `<div class="note">Syncing ${esc(sy.step)}${sy.total ? ` ${sy.done}/${sy.total}` : ""}…</div>` : ""}
      ${sy.error ? `<div class="note no">${esc(sy.error)}</div>` : ""}
      ${c ? `<div class="form">${t?.refreshToken ? `<button class="btn primary block" id="syncNow" ${sy.running ? "disabled" : ""}>Sync now</button><button class="btn block" id="syncOld" ${sy.running ? "disabled" : ""}>Load another year</button>` : ""}<button class="btn ${t?.refreshToken ? "" : "coral"} block" id="signin">${t?.refreshToken ? "Sign in again" : "Sign in with Google"}</button>${t?.refreshToken ? "" : `<button class="btn block" id="pasteSignin">Paste sign-in code</button><div class="note" style="margin-top:0">After Sign in with Google, if iPhone shows a page with a sign-in code, copy it and tap Paste sign-in code here.</div>`}</div>` : ""}
      ${(sy.log || []).length && !sy.running ? `<details class="how"><summary>Last sync details</summary><div class="log">${sy.log.map(l => `<div><b class="${l.ok ? "ok" : "no"}">${l.ok ? "OK" : "Problem"}</b> · ${esc(l.section)}: ${esc(l.detail)}</div>`).join("")}</div></details>` : ""}
    </div>
    <div class="card"><div class="card-head"><div><h2>${c ? "Your Google client" : "Connect, once"}</h2><div class="sub">${c ? `Saved on this phone: ${esc(c.id.slice(0, 14))}…` : "Use the client you made on the laptop. Add this app's address to it first."}</div></div></div>
      <div class="note" style="margin:0 0 6px">Setup code (backup): tap the box, tap Paste, then Connect.</div>
      <div class="addrow" style="margin-top:0"><input class="input" id="setupField" placeholder="sleep-setup:…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn small primary" id="pasteSetup">Connect</button></div>
      ${c ? `<button class="btn block" id="editClient" style="margin-top:10px">Change client by hand</button>` : ""}
      <div id="clientForm" ${c ? "hidden" : ""}>
        <ol class="steps">
          <li><b>Add this address to your Google client</b>In Google Cloud, open <a href="https://console.cloud.google.com/auth/clients" target="_blank" rel="noopener">Clients</a>, open your client and add it under <i>Authorised JavaScript origins</i> and <i>Authorised redirect URIs</i>:<br><span class="code">${esc(SHOWN_ORIGIN)}</span> ${copyBtn(SHOWN_ORIGIN)}<br><span class="code">${esc(SHOWN_REDIRECT)}</span> ${copyBtn(SHOWN_REDIRECT)}</li>
          <li><b>Paste the client ID and secret</b><form class="form" onsubmit="return false"><input class="input" id="cid" placeholder="Client ID" autocomplete="off" autocapitalize="off" spellcheck="false"><input class="input" id="csec" placeholder="Client secret" type="password" autocomplete="off"><button class="btn primary" id="saveClient" type="button">Save</button></form></li>
          <li><b>Sign in with Google</b>You type your password on Google's page. The first sync reads the last 12 months.</li>
        </ol>
      </div>
      <details class="how"><summary>Signed in on another screen?</summary><p>If iPhone finished the Google sign-in in a different window, that window shows a sign-in code. Copy it, come back here and paste it.</p><div class="addrow"><input class="input" id="handoff" placeholder="Paste sign-in code" autocomplete="off"><button class="btn small" id="useHandoff">Use</button></div></details>
    </div>
    <div class="card"><div class="card-head"><div><h2>Settings</h2></div></div>
      <div class="metric" style="margin-top:0"><div class="lab"><span>Nightly sleep target</span><b id="tgtV">${S.target} h</b></div><input type="range" id="tgt" min="6" max="10" step="0.5" value="${S.target}" style="width:100%;accent-color:#1f1b17"></div>
      <div class="note">Add to your home screen: in Safari tap Share, then Add to Home Screen. In Testing mode Google asks you to sign in again every 7 days.</div>
    </div>
    <div class="card"><h2>Privacy</h2><p class="note" style="margin-top:6px">This app talks only to Google: its sign-in page and the Google Health API, read-only. Your nights and sign-in stay in this phone's storage for this app. No analytics, no other servers. The code is open on GitHub. Built on Wristside (MIT). Version ${APP_VERSION}.</p></div>`;
  el.querySelectorAll("[data-copy]").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; } catch { b.textContent = "Select and copy"; } setTimeout(() => b.textContent = "Copy", 1500); });
  const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = fn; };
  on("saveClient", () => { const id = $("#cid").value.trim(), secret = $("#csec").value.trim(); if (!/\.apps\.googleusercontent\.com$/.test(id) || secret.length < 8) { flash = {ok:false, text:"That does not look like a Google client ID and secret."}; return renderYou(); } LS.set("client", {id, secret}); flash = {ok:true, text:"Saved. Now sign in with Google."}; renderYou(); });
  on("editClient", () => { $("#clientForm").hidden = false; $("#editClient").hidden = true; });
  on("pasteSetup", async () => { let txt = $("#setupField").value; if (!parseSetup(txt)) { try { txt = await navigator.clipboard.readText(); } catch {} } const c2 = parseSetup(txt); if (!c2) { flash = {ok:false, text:"No setup code found. Paste it into the box first."}; return renderYou(); } const linked = applySetup(c2); flash = {ok:true, text: linked ? "Connected. Syncing your nights." : "Google client saved. Now tap Sign in with Google."}; renderYou(); if (linked) sync(); });
  on("signin", () => signIn());
  on("syncNow", () => sync());
  on("syncOld", () => sync({history:true}));
  on("pasteSignin", async () => { let txt = ""; try { txt = await navigator.clipboard.readText(); } catch {} if (!/^sleep-signin:/.test(txt.trim())) txt = prompt("Paste the sign-in code here:") || ""; await useSignin(txt); });
  on("useHandoff", async () => useSignin($("#handoff").value));
  const tg = $("#tgt"); tg.oninput = () => { $("#tgtV").textContent = tg.value + " h"; }; tg.onchange = () => { S.target = +tg.value; LS.set("target", S.target); };
}
function applySetup(c) {
  LS.set("client", {id: c.id, secret: c.secret});
  if (c.refresh) { LS.set("tokens", {access: null, refreshToken: c.refresh, exp: 0, at: new Date().toISOString(), via: "laptop"}); return true; }
  return false;
}
function handleSetupLink() {
  if (!location.hash.startsWith("#setup=")) return null;
  const code = location.hash.slice(7), c = parseSetup(code);
  if (!c) { history.replaceState(null, "", location.pathname + "#you"); flash = {ok:false, text:"That setup link was not complete. Scan the QR code again."}; return "bad"; }
  if (!standalone()) { document.querySelectorAll('link[rel="manifest"]').forEach(l => l.remove()); renderSetup(c, code); return "safari"; }
  const t = tokens();
  history.replaceState(null, "", location.pathname + "#night");
  if (c.refresh && t?.refreshToken === c.refresh) return "already";
  const linked = applySetup(c);
  flash = {ok:true, text: linked ? "Connected. Syncing your nights." : "Google client saved. Now tap Sign in with Google."};
  if (linked) setTimeout(() => sync(), 300);
  return linked ? "linked" : "client";
}
function renderSetup(c, code) {
  document.querySelector(".tabbar").hidden = true; $("#datenav").style.visibility = "hidden";
  const sec = $("#s-night"); sec.hidden = false;
  sec.innerHTML = `<div class="handoff"><div style="font-size:48px">📲</div><div class="title">${c.refresh ? "Your connection is here." : "Your Google client is here."}</div><p class="lede">Add Sleep to your Home Screen from this page. The icon carries the connection, so nothing to copy or paste.</p>
    <div class="card" style="text-align:left"><ol class="steps">
      <li><b>Delete any old Sleep icon first</b>Press and hold it on the Home Screen, then Remove App, then Delete from Home Screen.</li>
      <li><b>Tap Share</b>The square with an arrow, at the bottom of Safari.</li>
      <li><b>Tap Add to Home Screen, then Add</b>Keep the name Sleep.</li>
      <li><b>Open Sleep from the Home Screen</b>${c.refresh ? "It connects by itself and your nights load." : "Go to You and tap Sign in with Google."}</li>
    </ol></div>
    <div class="card" style="text-align:left"><h2>Sleep already on your Home Screen?</h2><p class="note" style="margin-top:4px">Copy the code, open Sleep, go to You, tap the setup code box, tap Paste, then Connect.</p><button class="btn primary block" id="cpySetup">Copy setup code</button></div></div>`;
  $("#cpySetup").onclick = async () => { try { await navigator.clipboard.writeText(SETUP_PREFIX + code); $("#cpySetup").textContent = "Copied. Now open Sleep from the Home Screen"; } catch { $("#cpySetup").textContent = "Could not copy on this phone: use Add to Home Screen above"; } };
}

async function useSignin(text) {
  try { const h = JSON.parse(unb64uStr(String(text || "").trim().replace(/^sleep-signin:/, ""))); await exchange(h.c, h.v); flash = {ok:true, text:"Signed in. Syncing your nights."}; renderYou(); sync(); }
  catch (e) { flash = {ok:false, text:"That sign-in code did not work (" + e.message + "). Tap Sign in with Google again and use the new code within 10 minutes."}; renderYou(); }
}
function renderHandoff(code) {
  document.querySelector(".tabbar").hidden = true; $("#datenav").style.visibility = "hidden";
  const sec = $("#s-night"); sec.hidden = false;
  sec.innerHTML = `<div class="handoff"><div style="font-size:48px">🔑</div><div class="title">Signed in. One more tap.</div>
    <p class="lede">Google finished in this window, not in the Sleep app. Copy the code, go back to the Sleep app and paste it. It works for 10 minutes.</p>
    <div class="card" style="text-align:left"><ol class="steps"><li><b>Copy the sign-in code</b><button class="btn primary block" id="cpy" style="margin-top:8px">Copy sign-in code</button></li>
    <li><b>Go back to Sleep</b>Tap Done at the top left, or open Sleep from your Home Screen.</li>
    <li><b>Paste it</b>In You, tap Paste sign-in code.</li></ol>
    <div class="code" style="display:block;padding:10px;margin-top:6px;font-size:11px">${esc(code)}</div></div></div>`;
  $("#cpy").onclick = async () => { try { await navigator.clipboard.writeText("sleep-signin:" + code); $("#cpy").textContent = "Copied. Now go back to Sleep"; } catch { $("#cpy").textContent = "Press and hold the code below to copy it"; } };
}


/* ---------------- unfinished nights ---------------- */
// Google creates a provisional sleep record during the night and finalises it about 4 hours after
// you wake (seen on every night 15-24 Nov 2026). Until then minutes and times can still change.
const FINAL_AFTER = 3 * 3600000;
const isProvisional = (n) => Boolean(n && n.src === "api" && Date.now() - n.end < 24 * 3600000 && (!n.updated || n.updated - n.end < FINAL_AFTER));
function maybeSync() {
  if (!connected() || S.sync.running) return;
  const last = Date.parse(LS.get("lastSyncAt") || 0) || 0, age = Date.now() - last;
  const latest = S.nights[S.nights.length - 1];
  if (age > 30 * 60000 || (isProvisional(latest) && age > 5 * 60000)) sync();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") maybeSync(); });

/* ---------------- self-update ---------------- */
async function checkForUpdate() {
  try {
    const r = await fetch(`version.json?t=${Date.now()}`, {cache: "no-store"});
    if (!r.ok) return;
    const {version} = await r.json();
    if (!version || version === APP_VERSION || LS.get("updatedTo") === version) return;
    LS.set("updatedTo", version);
    try { for (const reg of (await navigator.serviceWorker?.getRegistrations()) || []) await reg.unregister(); } catch {}
    try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
    location.replace(`${location.pathname}?v=${encodeURIComponent(version)}${location.hash}`);
  } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForUpdate(); });

/* ---------------- shell ---------------- */
function paint() {
  const n = S.byDate.get(S.date), i = S.nights.findIndex(x => x.date === S.date);
  $("#dateLbl").textContent = n ? dayLabel(n.date) : "";
  $("#prev").disabled = i <= 0; $("#next").disabled = i < 0 || i >= S.nights.length - 1;
  $("#datenav").style.visibility = S.tab === "night" ? "visible" : "hidden";
  $("#topRight").innerHTML = S.mode === "sample" ? `<button class="chip-sample" onclick="go('you')">Sample</button>` : S.sync.running ? `<span class="chip-sync"><i style="background:#5b6fd6"></i>Syncing…</span>` : `<button class="chip-sync" onclick="go('you')"><i></i>${LS.get("lastSyncAt") ? "Synced" : "Connected"}</button>`;
  document.querySelectorAll(".tabbar button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  for (const t of ["night", "trends", "you"]) $("#s-" + t).hidden = t !== S.tab;
  if (S.tab === "night") renderNight(); else if (S.tab === "trends") renderTrends(); else renderYou();
}
function go(tab, date) { if (date) S.date = date; location.hash = tab === "night" && S.date ? `night/${S.date}` : tab; }
function route() { const [t, a] = location.hash.replace(/^#/, "").split("/"); S.tab = ["night", "trends", "you"].includes(t) ? t : "night"; if (S.tab === "night" && a && S.byDate.has(a)) S.date = a; if (S.tab !== "night") wakesAll = false; window.scrollTo(0, 0); paint(); }
document.querySelectorAll(".tabbar button").forEach(b => b.onclick = () => go(b.dataset.tab));
const step = (d) => { const i = S.nights.findIndex(x => x.date === S.date), j = i + d; if (j >= 0 && j < S.nights.length) { wakesAll = false; go("night", S.nights[j].date); } };
$("#prev").onclick = () => step(-1); $("#next").onclick = () => step(1);
let sx = null; document.addEventListener("touchstart", e => { if (S.tab === "night" && !e.target.closest(".tl,.mini,input")) sx = [e.touches[0].clientX, e.touches[0].clientY]; else sx = null; }, {passive:true});
document.addEventListener("touchend", e => { if (!sx) return; const dx = e.changedTouches[0].clientX - sx[0], dy = e.changedTouches[0].clientY - sx[1]; if (Math.abs(dx) > 70 && Math.abs(dy) < 40) step(dx < 0 ? 1 : -1); sx = null; }, {passive:true});
addEventListener("hashchange", route);
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(paint, 200); });

(async () => {
  const r = await handleRedirect();
  if (r?.handoff) return renderHandoff(r.handoff);
  const setupResult = handleSetupLink();
  if (setupResult === "safari") return;
  await loadLocal();
  if (r?.error) flash = {ok:false, text:r.error};
  if (r?.signedIn) { flash = {ok:true, text:"Signed in. Syncing your nights."}; }
  route();
  if (r?.signedIn) sync();
  else if (connected()) maybeSync();
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker?.register("sw.js").catch(() => {});
  checkForUpdate();
})();
window.__sleep = {S, computeMetrics, go};
</script>
